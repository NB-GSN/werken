<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkstatt – Holzprojekte Schritt für Schritt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2118">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Werkanleitungen mit Größenrechner: Holz-Tannen mit Lichterkette und Holzstern-Rahmen.">
<style>
@font-face{font-family:'Dancing Script';src:url(fonts/dancing-script-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Dancing Script';src:url(fonts/dancing-script-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#f5efe6; --card:#fffdf9; --ink:#2b2118; --muted:#6f6254; --line:#e3d8c8;
  --wood:#d9b07c; --wood-d:#a8743f; --accent:#9b4a1f; --accent-l:#f3e1d2; --green:#3d6b4a; --green-l:#e3efe5;
  --warn:#b4541a; --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
header .back{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer;border-radius:8px}
header .back:hover{background:#ffffff1a}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{font-size:12.5px;opacity:.7}
main{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.hero{padding:18px 4px 6px}
.hero h2{font-size:26px;margin:0 0 6px}
.hero p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;display:block;transition:transform .12s, box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px #2b211814}
.pcard .thumb{background:#2f2620;display:flex;justify-content:center;padding:14px;height:210px}
.pcard .thumb svg{height:100%;width:auto}
.pcard .body{padding:14px 16px 16px}
.pcard h3{margin:0 0 4px;font-size:19px}
.pcard p{margin:0;color:var(--muted);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
h2.sec{font-size:20px;margin:28px 4px 4px}
h2.sec.jun{color:var(--green)}
h2.sec span{font-size:13px;background:var(--green);color:#fff;border-radius:99px;padding:3px 10px;vertical-align:middle;margin-left:6px;font-weight:600}
.pcard.jun .thumb{background:#2c3a2f}
.pcard.jun .tag{background:var(--green-l);color:var(--green)}
h2.sec.pap{color:#3b5b8a}
h2.sec.pap span{background:#3b5b8a}
.pcard.pap .thumb{background:#2c3a4a}
.pcard.pap .tag{background:#e3ebf5;color:#3b5b8a}
.safe{background:#fff4d6;border-left:4px solid #d9a400;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14.5px}
.tag{font-size:12.5px;background:var(--accent-l);color:var(--accent);border-radius:99px;padding:2px 10px}
.sizebar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:4px 0 12px}
.sizebar .lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.custom{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.custom input,.custom select{width:84px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
.custom select{width:auto}
.row2{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--muted);font-weight:550}
nav.tabs button.on{background:var(--ink);color:#fff}
nav.tabs .n{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#0000000f;font-size:12px;margin-right:6px}
nav.tabs button.on .n{background:#ffffff26}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:18px}
.panel h4{margin:16px 0 6px;font-size:15.5px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0 4px}
.fact{background:var(--bg);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:20px}
.fact span{font-size:12.5px;color:var(--muted)}
.drawing{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}
.drawing svg{display:block;width:100%;height:auto;max-height:70vh}
.legend{margin:6px 0 2px;padding-left:0;list-style:none;counter-reset:l;font-size:14.5px}
.legend li{counter-increment:l;display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.legend li::before{content:counter(l);flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
td.num,.num{font-variant-numeric:tabular-nums;font-weight:600}
table.parts td:first-child{width:34%}
.tblwrap{overflow-x:auto}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:0 0 auto}
.check.done span{color:var(--muted);text-decoration:line-through}
.anglecard{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.anglecard:last-child{border-bottom:0}
.badge{background:var(--accent);color:#fff;border-radius:12px;text-align:center;padding:10px 4px}
.badge b{display:block;font-size:24px;line-height:1.1}
.badge span{font-size:11px;opacity:.85}
.badge.alt{background:var(--green)}
.badge.hand{background:var(--wood-d)}
.note{background:var(--green-l);border-left:4px solid var(--green);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14.5px}
.warn{background:#fbe7d8;border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14.5px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.progress div{height:100%;background:var(--green);transition:width .2s}
.stepnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stepnav button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:14px;cursor:pointer;color:var(--ink)}
.stepnav button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.stepnav button.ok{border-color:var(--green);background:var(--green-l)}
.stepnav button.on.ok{background:var(--accent)}
.step h3{display:flex;gap:10px;align-items:baseline}
.step .num{color:var(--accent);font-size:15px;font-weight:700;white-space:nowrap}
.step ul{padding-left:20px;margin:8px 0}
.step li{margin:4px 0}
.btns{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:15px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:var(--line);color:var(--ink)}
.btn.ok{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.next{display:block;text-align:right;margin-top:6px}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12.5px}
@media print{header,nav.tabs,.sizebar .chips,.btns,.stepnav{display:none}}

.pcard .thumb{padding:0;height:auto;aspect-ratio:340/220;display:block;background:#2f2620}
.pcard .thumb svg{width:100%;height:100%;display:block}
.heroimg{border-radius:var(--r);overflow:hidden;margin:0 0 12px;border:1px solid var(--line);aspect-ratio:340/220;background:#2f2620}
.heroimg svg{width:100%;height:100%;display:block}
h4.ch{margin:16px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.cattiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 6px}
.cattile{border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);text-align:left;box-shadow:0 1px 0 var(--line);font:inherit;color:inherit}
.cattile .ct-img{aspect-ratio:1/1;overflow:hidden}
.cattile .ct-img svg{width:100%;height:100%;display:block}
.cattile .ct-body{padding:8px 10px 10px}
.cattile b{display:block;font-size:16px}
.cattile span{font-size:12px;color:var(--muted)}
.catsec{scroll-margin-top:60px}
h2.sec{font-size:24px;margin:30px 4px 2px}
h2.sec.cat-holz{color:#9b4a1f} h2.sec.cat-papier{color:#3b5b8a} h2.sec.cat-mal{color:#7b3f8c}
.pcard.cat-papier .tag{background:#e3ebf5;color:#3b5b8a}
.pcard.cat-mal .tag{background:#f0e4f4;color:#7b3f8c}
.jbadge{display:inline-block;font-size:12px;font-weight:700;background:var(--green);color:#fff;border-radius:99px;padding:2px 10px;margin-bottom:6px}
h3.subsec{font-size:17px;margin:22px 4px 2px;color:#7b3f8c}

.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none;font-family:inherit}
.tbtn.on{border-color:#d9a400;background:#fff4d6}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:transform .25s;z-index:20}
#toast.show{transform:translateX(-50%) translateY(0)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0;position:sticky;top:52px;z-index:3;background:var(--bg);padding:8px 0}
.abclink{display:flex;flex-direction:column;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin:12px 0 0;text-decoration:none}
.abclink b{font-size:16px}.abclink span{font-size:13px;opacity:.8}
.mine h3{margin-bottom:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mrow:last-child{border-bottom:0}
.mrow .mt{font-weight:600;font-size:15px}
.mrow .mp{display:flex;align-items:center;gap:8px;flex:0 0 120px}
.mrow .progress{flex:1;margin:0;height:7px;display:block}
.mrow .progress span{display:block;height:100%;background:var(--green)}
.fbadge{display:inline-block;font-size:12px;font-weight:700;background:#fff4d6;color:#8a6a00;border-radius:99px;padding:2px 10px;margin:0 6px 6px 0}
details.abc{border-bottom:1px solid var(--line);padding:4px 0}
details.abc:last-child{border-bottom:0}
details.abc summary{cursor:pointer;font-weight:650;padding:8px 0;list-style:none}
details.abc summary::before{content:'＋ ';color:var(--accent)}
details.abc[open] summary::before{content:'－ '}
details.abc p{margin:0 0 10px;font-size:15px}
.printbar{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.ph{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}
.ph h1{font-size:24px;margin:0 0 4px}
.qr{text-align:center;flex:0 0 auto}
.qr svg{width:110px;height:110px;display:block;background:#fff}
.qr small{font-size:11px;color:var(--muted)}
.plist{list-style:none;padding:0;margin:4px 0}
.plist li{padding:3px 0}
.psteps li{margin:0 0 10px}
.psteps li p,.psteps li ul{margin:4px 0}
@media print{
  body{background:#fff;font-size:12pt}
  header,footer,.printbar,.toolbar,.filters,#toast{display:none!important}
  main{padding:0;max-width:none}
  .panel{border:0;padding:0;margin:0 0 14px;break-inside:auto;background:none}
  .drawing,.anglecard,.heroimg,table,.psteps li{break-inside:avoid}
  .heroimg{max-width:420px;margin:0 auto 12px}
  .drawing svg{max-height:120mm}
  .safe,.note,.warn{border-left-width:3px}
  a{color:inherit;text-decoration:none}
}

.tpl .tplpage{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin:0 0 14px}
.tpl .tplpage svg{max-width:100%;height:auto;display:block}
.tplhead{font-size:13px;font-weight:700;margin-bottom:4px}
.tplscale{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:4px}
.tplscale svg{width:50mm!important;height:4mm!important;max-width:none!important}
@media print{
  @page{size:A4;margin:8mm}
  .tpl .tplpage{border:0;padding:0;margin:0;break-after:page}
  .tpl .tplpage svg{max-width:none}
  .warn{display:none}
}
</style>
</head>

<script>
'use strict';
const DEG = Math.PI / 180;
const fmt = (x, d = 0) => (Math.round(x * 10 ** d) / 10 ** d).toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
const mm = x => fmt(x) + ' mm';
const cm = x => fmt(x / 10, x < 1000 ? 0 : 0) + ' cm';
const m = x => fmt(x / 1000, 1) + ' m';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ================= GRAFIK-HELFER ================= */
const P2 = p => p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const f1 = v => (+v).toFixed(1);
// Holzteil mit Verlauf, Maserung und Lichtkante. p = 4 Punkte, p0-p1 und p3-p2 sind die Längskanten
function woodPoly(p, tone = 'wood', sw = 1) {
  const st = {dougl: '#a2603a', oak: '#9c7442', ply: '#b38a55', wood: '#9a6a36', bark: '#4a3220'}[tone] || '#9a6a36';
  let s = `<polygon points="${P2(p)}" fill="url(#g-${tone})" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const L = Math.max(Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]), Math.hypot(p[2][0] - p[3][0], p[2][1] - p[3][1]));
  if (L > 12) for (const f of [0.26, 0.48, 0.7]) {
    const a = lerp2(p[0], p[3], f), b = lerp2(p[1], p[2], f);
    const s0 = lerp2(a, b, 0.06 + 0.14 * f), s1 = lerp2(a, b, 0.9 - 0.12 * f), mid = lerp2(s0, s1, 0.5);
    const nx = -(s1[1] - s0[1]), ny = s1[0] - s0[0], nl = Math.hypot(nx, ny) || 1, wob = (f - 0.48) * Math.min(4, L / 30);
    s += `<path d="M${f1(s0[0])} ${f1(s0[1])} Q${f1(mid[0] + nx / nl * wob)} ${f1(mid[1] + ny / nl * wob)} ${f1(s1[0])} ${f1(s1[1])}" fill="none" stroke="#6b3f1c" stroke-opacity=".22" stroke-width=".8" stroke-linecap="round"/>`;
  }
  s += `<line x1="${f1(p[0][0])}" y1="${f1(p[0][1])}" x2="${f1(p[1][0])}" y2="${f1(p[1][1])}" stroke="#fff" stroke-opacity=".45" stroke-width=".9"/>`;
  return s;
}
function sampleLine(poly, step) {
  const out = []; let carry = 0;
  for (let i = 0; i < poly.length - 1; i++) {
    const a = poly[i], b = poly[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let t = carry; while (t < L) { out.push(lerp2(a, b, t / L)); t += step; } carry = t - L;
  }
  return out;
}
const glowDots = (pts, r = 1.8, col = '#ffd877') => `<g filter="url(#f-glow)">${pts.map(q => `<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="${r}" fill="${col}"/>`).join('')}</g>`;
const wire = pts => `<polyline points="${P2(pts)}" fill="none" stroke="#2a2a22" stroke-opacity=".45" stroke-width=".7"/>`;
function starShape(cx, cy, R, col = '#f6c453', rot = 0) {
  const pts = Array.from({length: 10}, (_, k) => { const a = (rot - 90 + 36 * k) * DEG, r = k % 2 ? R * 0.42 : R; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
  return `<polygon points="${P2(pts)}" fill="${col}" stroke="#c98d1c" stroke-width=".6"/>`;
}
function snowDots(W, H, n, seed, col = '#fff', op = .8) {

const halo = (cx, cy, rx, ry, op = .45) => `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="url(#g-halo)" opacity="${op}"/>`;
const floorShadow = (cx, y, rx) => `<ellipse cx="${f1(cx)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(rx * 0.12)}" fill="#000" opacity=".22" filter="url(#f-blur)"/>`;

function branch(x, y, len, ang, seed) {
  const r = rng(seed); let o = '';
  const ex = x + len * Math.cos(ang * DEG), ey = y + len * Math.sin(ang * DEG);
  o += `<line x1="${f1(x)}" y1="${f1(y)}" x2="${f1(ex)}" y2="${f1(ey)}" stroke="#5a3d22" stroke-width="1.2"/>`;
  for (let i = 0; i < 26; i++) {
    const t = i / 26, px = x + (ex - x) * t, py = y + (ey - y) * t, side = i % 2 ? 1 : -1, nl = (7 + 5 * r()) * (1 - t * 0.4);
    const a = (ang + side * (55 + 15 * r())) * DEG;
    o += `<line x1="${f1(px)}" y1="${f1(py)}" x2="${f1(px + nl * Math.cos(a))}" y2="${f1(py + nl * Math.sin(a))}" stroke="${r() > .5 ? '#2f6b3a' : '#3f8a4b'}" stroke-width="1.1" stroke-linecap="round"/>`;
  }
  return o;
}

/* ---------------- Zuschnittplan (Stangen aufteilen) ---------------- */
function cutPlan(pieces, stock, kerf = 4) {
  const list = pieces.slice().sort((a, b) => b.len - a.len);
  const bars = [];
  for (const p of list) {
    let bar = bars.find(b => b.rest >= p.len + kerf);
    if (!bar) { bar = {rest: stock, items: []}; bars.push(bar); }
    bar.items.push(p); bar.rest -= p.len + kerf;
  }
  return bars;
}
function planHTML(bars, stock) {
  const W = 400, H = 40, gap = 10;
  let y = 6, out = '';
  bars.forEach((b, i) => {
    let x = 28;
    out += `<text x="4" y="${y + 26}" font-size="15" fill="#6f6254">${i + 1}.</text>`;
    out += `<rect x="28" y="${y}" width="${W - 28}" height="${H}" rx="5" fill="#f5efe6" stroke="#e3d8c8"/>`;
    b.items.forEach((p, k) => {
      const w = p.len / stock * (W - 28);
      out += `<rect x="${x}" y="${y}" width="${Math.max(w - 1.5, 2)}" height="${H}" rx="4" fill="${k % 2 ? '#c99a63' : '#d9b07c'}" stroke="#a8743f" stroke-width=".8"/>`;
      if (w > 44) out += `<text x="${x + w / 2}" y="${y + 25}" font-size="13.5" text-anchor="middle" fill="#2b2118">${esc(p.short)} ${fmt(p.len)}</text>`;
      else if (w > 16) out += `<text x="${x + w / 2}" y="${y + 25}" font-size="12" text-anchor="middle" fill="#2b2118">${esc(p.short)}</text>`;
      x += w + 4 / stock * (W - 28);
    });
    y += H + gap;
  });
  return `<svg viewBox="0 0 ${W} ${y}" role="img" aria-label="Zuschnittplan">${out}</svg>`;
}

// Viereck: Außenkante oben von 0 bis outer, Innenkante unten von off bis off+inner
function pieceSVG(o) {
  const minX = Math.min(0, o.off), maxX = Math.max(o.outer, o.off + o.inner);
  const span = maxX - minX, W = 460, padL = 12, padR = 12;
  const s = (W - padL - padR) / span;
  const th = Math.max(o.thick * s, 34);
  const X = x => padL + (x - minX) * s, y0 = 40, y1 = y0 + th;
  const poly = woodPoly([[X(0), y0], [X(o.outer), y0], [X(o.off + o.inner), y1], [X(o.off), y1]], o.tone || 'wood', 1.5);
  return `<svg viewBox="0 0 ${W} ${y1 + 72}" role="img" aria-label="${esc(o.title)}">
    <g filter="url(#f-sh)">${poly}</g>
    <line x1="${X(0)}" y1="${y0 - 12}" x2="${X(o.outer)}" y2="${y0 - 12}" stroke="#2b2118" stroke-width="1"/>

/* ================= PROJEKT: TANNEN ================= */
function tanneCalc(H, wSel) {
  const w = wSel === 'auto' ? (H >= 800 ? 44 : 28) : +wSel;
  const A = 67.5 * DEG, sa = Math.sin(A), ta = Math.tan(A);
  const wh = w / sa, h = H - 3 * w;
  // Ast-Spitzen bei 60 % und 30 % der Rahmenhöhe, Überlappung 12 %
  const y1 = 0.6 * h, y2 = 0.3 * h, ovv = 0.12 * h;
  const c = {H, w, h, wh, y1, y2, ovv, auto: wSel === 'auto'};
  c.Tout = (h - y1) / sa;
  c.Tin = (h - y1 - wh * ta) / sa;
  c.MB = (y1 + ovv - y2) / sa;
  c.ov = ovv / sa;
  c.cbTop = 2 * (h / ta - 2 * wh);
  c.cbBot = c.cbTop + 2 * w / ta;
  c.f1 = 0.30 * c.cbBot; c.f2 = 0.42 * c.cbBot; c.fq = 0.30 * H;
  c.apexMark = w * ta;            // Länge des Spitzenschnitts entlang der Kante
  c.hcut = w / ta;                // Versatz des 22,5°-Schnitts entlang der Kante
  c.notch = wh;                   // Absatz unter jedem Ast
  c.stepM = y1 + 3 * w; c.stepB = y2 + 3 * w;
  c.screwOv = w >= 44 ? '4 × 80 mm' : w >= 34 ? '4 × 60 mm' : '3,5 × 50 mm';
  c.screwBase = w >= 44 ? '5 × 80 mm' : w >= 34 ? '4 × 70 mm' : '4 × 50 mm';
  c.stock = 2400;
  c.inner = y => (h - y) / ta - (y >= y1 + ovv ? wh : y >= y2 + ovv ? 2 * wh : 3 * wh);
  let L = 0;
  for (let y = 40; y < h - wh * ta; y += 80) L += 2 * Math.max(c.inner(y), 0) / Math.cos(10 * DEG);
  c.lights = L;
  c.pieces = [
    {short: 'O', name: 'Oberstab', n: 2, len: c.Tout},
    {short: 'M', name: 'Mittelstab', n: 2, len: c.MB + c.hcut},
    {short: 'U', name: 'Unterstab', n: 2, len: c.MB + c.hcut},
    {short: 'Q', name: 'Querholz', n: 1, len: c.cbBot},
    {short: 'F1', name: 'Fuß oben', n: 1, len: c.f1},
    {short: 'F2', name: 'Fuß unten', n: 1, len: c.f2}
  ];
  c.wood = c.pieces.reduce((s, p) => s + p.n * p.len, 0);
  c.bad = c.Tin < 2 * w;
  return c;
}

/* ---- Tanne ---- */
function tanneArt(c, o) {
  const {h, w, wh, y1, y2, ovv} = c, ta = Math.tan(67.5 * DEG);
  const s = o.s, cx = o.cx, floor = o.floor, tone = o.tone || 'dougl';
  const pt = (x, y) => [cx + x * s, floor - (y + 3 * w) * s];
  const xT = y => (h - y) / ta, tip = h - wh * ta;
  const bar = (sg, off, ya, yb) => [pt(sg * (xT(ya) + off), ya), pt(sg * (xT(yb) + off), yb), pt(sg * (xT(yb) + off - wh), yb), pt(sg * (xT(ya) + off - wh), ya)];
  let g = '';
  const ct = c.cbTop / 2, cbb = c.cbBot / 2;
  for (const [L, yt] of [[c.f2, -2 * w], [c.f1, -w]]) g += woodPoly([pt(-L / 2 + w, yt), pt(L / 2 - w, yt), pt(L / 2, yt - w), pt(-L / 2, yt - w)], tone);
  g += woodPoly([pt(-ct, 0), pt(ct, 0), pt(cbb, -w), pt(-cbb, -w)], tone);
  for (const sg of [1, -1]) {
    g += woodPoly(bar(sg, -2 * wh, 0, y2 + ovv), tone);
    g += woodPoly(bar(sg, -wh, y2, y1 + ovv), tone);
    g += woodPoly([pt(sg * xT(y1), y1), pt(0, h), pt(0, tip), pt(sg * (xT(y1) - wh), y1)], tone);
  }
  const zig = []; let side = 1;
  for (let y = 40; y < tip; y += 80) { zig.push(pt(side * (c.inner(y) - 4), y)); side = -side; }
  let lights = '';
  if (o.lights === 'glow') lights = wire(zig) + glowDots(sampleLine(zig, Math.max(4, 70 * s)), Math.max(1.1, 13 * s));
  else if (o.lights === 'dash') lights = `<polyline points="${P2(zig)}" fill="none" stroke="#e8a317" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>`;
  const top = pt(0, h);
  const star = o.star ? `<g filter="url(#f-glow)">${starShape(top[0], top[1] - 7, 9)}</g>` : '';
  return `<g filter="url(#f-sh)">${g}</g>${lights}${star}`;
}

  lab += `<text x="${cx}" y="${floor + 40}" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2118">${fmt(c.cbBot / 10)} cm</text>`;

/* ================= PROJEKT: STERN ================= */
function sternCalc(H, t, d) {
  const c = {H, t, d};
  c.R = H / (1 + Math.cos(36 * DEG));
  c.r = c.R * Math.sin(18 * DEG) / Math.sin(126 * DEG);
  c.a = Math.sqrt(c.R ** 2 + c.r ** 2 - 2 * c.R * c.r * Math.cos(36 * DEG));
  c.tipOff = t / Math.tan(18 * DEG);
  c.inOff = t / Math.tan(54 * DEG);
  c.Lin = c.a - c.tipOff + c.inOff;
  c.ext = c.a + c.inOff;
  c.W = 2 * c.R * Math.sin(72 * DEG);
  c.chord = 2 * c.R * Math.sin(36 * DEG);
  c.Ri = c.R - t / Math.sin(18 * DEG);
  c.ri = c.r - t / Math.sin(54 * DEG);
  c.stock = 2000;
  c.pieces = Array.from({length: 10}, () => ({short: 'S', name: 'Stab', n: 1, len: c.ext}));
  c.wood = 10 * c.ext;
  c.bad = c.Lin < 2.5 * t;
  return c;
}
function starPts(R, r, cx, cy, s) {
  return Array.from({length: 10}, (_, k) => {
    const ang = (90 + 36 * k) * DEG, rad = k % 2 ? r : R;
    return [cx + rad * Math.cos(ang) * s, cy - rad * Math.sin(ang) * s];
  });
}
/* ---- Stern ---- */
function sternArt(c, o) {
  const s = o.s, cx = o.cx, cy = o.cy, tone = o.tone || 'oak';
  const P = starPts(c.R, c.r, cx, cy, s), Q = starPts(c.Ri, c.ri, cx, cy, s);
  let g = '';
  if (o.depth) {
    const dx = o.depth * 0.8, dy = -o.depth * 0.55, sh = q => [q[0] + dx, q[1] + dy];
    for (let k = 0; k < 10; k++) { const k2 = (k + 1) % 10; g += `<polygon points="${P2([sh(P[k]), sh(P[k2]), sh(Q[k2]), sh(Q[k])])}" fill="#b78852" stroke="#8a6034" stroke-width=".8"/>`; }
    for (let k = 0; k < 10; k++) { const k2 = (k + 1) % 10; g += `<polygon points="${P2([P[k], P[k2], sh(P[k2]), sh(P[k])])}" fill="url(#g-side)" stroke="#8a6034" stroke-width=".7"/><polygon points="${P2([Q[k], Q[k2], sh(Q[k2]), sh(Q[k])])}" fill="#c99d65" stroke="#8a6034" stroke-width=".7"/>`; }
  }
  for (let k = 0; k < 10; k++) { const k2 = (k + 1) % 10; g += woodPoly([P[k], P[k2], Q[k2], Q[k]], tone); }
  return {g: `<g filter="url(#f-sh)">${g}</g>`, P, Q};
}
function sternSVG(c, labels = true) {
  const s = 300 / c.W, cx = 170, cy = 40 + c.R * s;
  const {g, P} = sternArt(c, {s, cx, cy});
  const yb = cy + c.R * Math.cos(36 * DEG) * s;
  const out = (p, dist) => { const dx = p[0] - cx, dy = p[1] - cy, L = Math.hypot(dx, dy); return [p[0] + dx / L * dist, p[1] + dy / L * dist]; };
  const b1 = out(P[0], 22), b2 = out(P[9], 26), mid = [(P[8][0] + P[9][0]) / 2, (P[8][1] + P[9][1]) / 2], b3 = out(mid, 22);
  let lab = badge(b1[0] + 18, b1[1] + 6, 1) + badge(b2[0], b2[1], 2) + badge(b3[0], b3[1], 3);
  const hw = c.W / 2 * s;
  lab += `<line x1="${(cx - hw).toFixed(1)}" y1="${(yb + 18).toFixed(1)}" x2="${(cx + hw).toFixed(1)}" y2="${(yb + 18).toFixed(1)}" stroke="#2b2118"/>`;
  lab += `<text x="${cx}" y="${(yb + 42).toFixed(1)}" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2118">${fmt(c.W / 10)} cm breit · ${fmt(c.H / 10)} cm hoch</text>`;
  return `<svg viewBox="0 0 340 ${(yb + 54).toFixed(0)}" role="img" aria-label="Holzstern ${fmt(c.H / 10)} cm">${g}${lab}</svg>`;
}
function heroStern() {
  const fl = 190, c1 = sternCalc(600, 18, 80), c2 = sternCalc(450, 18, 80), s = 0.26;
  const yb1 = c1.R * Math.cos(36 * DEG) * s, yb2 = c2.R * Math.cos(36 * DEG) * s;
  let o = sceneWall(340, 220, fl);
  o += floorShadow(205, fl + 3, 70) + floorShadow(128, fl + 4, 60);
  o += sternArt(c2, {s, cx: 205, cy: fl - yb2 - 2, depth: 14, tone: 'oak'}).g;
  o += sternArt(c1, {s, cx: 128, cy: fl - yb1 + 2, depth: 16, tone: 'oak'}).g;
  o += branch(150, 206, 80, -12, 3) + branch(230, 204, 70, 190, 5) + branch(120, 210, 60, 200, 9);
  o += cone(196, 198, 8) + cone(240, 200, 7) + cone(110, 204, 7);
  o += `<circle cx="215" cy="205" r="5" fill="#9a6b3e"/><circle cx="224" cy="207" r="4.5" fill="#a87a4a"/><circle cx="140" cy="209" r="4.5" fill="#9a6b3e"/>`;
  return heroSVG(o, 'Zwei Holzsterne mit Zapfen und Tannengrün');
}

/* ================= PROJEKT: LATTEN-TANNE ================= */
function latteCalc(H, form, sizeSel) {
  const big = sizeSel === 'gross' || (sizeSel === 'auto' && H >= 90 * 10);
  const b = big ? 48 : 38, e = big ? 24 : 18, w = big ? 44 : 28;
  const alpha = +form, cot = 1 / Math.tan(alpha * DEG), cut = 90 - alpha;
  const g = Math.round(0.6 * b);
  const S = H - w;                       // Stamm steht auf dem Fuß
  const n = Math.max(3, Math.floor((0.8 * S + g) / (b + g)));
  const a0 = 0.75 * w / cot;              // virtuelle Spitze über dem Stamm
  const slats = Array.from({length: n}, (_, i) => {
    const top = 2 * (a0 + i * (b + g)) * cot;
    return {i, top, bot: top + 2 * b * cot};
  });
  const crown = n * b + (n - 1) * g;
  const F = Math.max(300, 0.4 * H);
  const c = {H, alpha, cot, cut, b, e, w, g, S, n, a0, slats, crown, bare: S - crown, F, big, sizeSel};
  c.width = slats[n - 1].bot;
  c.screw = big ? '4 × 60 mm' : '3,5 × 40 mm';
  c.lights = slats.reduce((s, x) => s + x.bot, 0) * 1.1 + crown;
  c.stock = 2400;
  c.pieces = slats.map(x => ({short: String(x.i + 1), name: 'Latte ' + (x.i + 1), n: 1, len: x.bot}));
  c.trunk = [{short: 'St', name: 'Stamm', n: 1, len: S}, {short: 'F', name: 'Fuß', n: 1, len: F}, {short: 'F', name: 'Fuß', n: 1, len: F}];
  c.woodSlats = slats.reduce((s, x) => s + x.bot, 0);
  c.woodTrunk = S + 2 * F;
  return c;
}
/* ---- Latten-Tanne ---- */
function latteArt(c, o) {
  const s = o.s, cx = o.cx, floor = o.floor, tone = o.tone || 'wood';
  const pt = (x, y) => [cx + x * s, floor - y * s];
  let g = '';
  g += woodPoly([pt(-c.F / 2, c.w), pt(c.F / 2, c.w), pt(c.F / 2, 0), pt(-c.F / 2, 0)], 'oak');
  g += woodPoly([pt(-c.w / 2, c.H), pt(-c.w / 2, c.w), pt(c.w / 2, c.w), pt(c.w / 2, c.H)], 'oak');
  const zig = [];
  c.slats.forEach((x, i) => {
    const yt = c.H - i * (c.b + c.g), yb = yt - c.b;
    g += woodPoly([pt(-x.top / 2, yt), pt(x.top / 2, yt), pt(x.bot / 2, yb), pt(-x.bot / 2, yb)], tone);
    const side = i % 2 ? -1 : 1;
    zig.push(pt(side * (x.bot / 2 - 12), yb + c.b * 0.35));
  });
  let lights = '';
  if (o.lights === 'glow') lights = wire(zig) + glowDots(sampleLine(zig, Math.max(4, 60 * s)), Math.max(1.1, 11 * s));
  else if (o.lights === 'dash') lights = `<polyline points="${P2(zig)}" fill="none" stroke="#e8a317" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>`;
  const top = pt(0, c.H);
  const star = o.star ? `<g filter="url(#f-glow)">${starShape(top[0], top[1] - 9, 10)}</g>` : '';
  return `<g filter="url(#f-sh)">${g}</g>${lights}${star}`;
}
function latteSVG(c, labels = true) {
  const s = 470 / c.H, cx = 170, floor = 30 + c.H * s;
  const X = x => (cx + x * s).toFixed(1), Y = y => (floor - y * s).toFixed(1);
  let o = latteArt(c, {s, cx, floor, lights: 'dash'});
  const k = Math.min(2, c.n - 1), x = c.slats[k], yt = c.H - k * (c.b + c.g);
  o += badge(+X(x.bot / 2) + 18, +Y(yt - c.b / 2), 1);
  const k2 = Math.min(4, c.n - 2), yg = c.H - k2 * (c.b + c.g) - c.b - c.g / 2;
  o += badge(+X(-c.slats[k2 + 1].bot / 2) - 18, +Y(yg), 2);
  o += badge(+X(c.w / 2) + 18, +Y(c.w + c.bare / 2), 3);
  o += badge(+X(c.F / 2) + 18, +Y(c.w / 2), 4);
  const half = Math.max(c.width, c.F) / 2 * s, x0 = cx - half - 34;
  o += `<line x1="${x0}" y1="${Y(c.H)}" x2="${x0}" y2="${floor}" stroke="#2b2118"/><line x1="${x0 - 6}" y1="${Y(c.H)}" x2="${x0 + 6}" y2="${Y(c.H)}" stroke="#2b2118"/><line x1="${x0 - 6}" y1="${floor}" x2="${x0 + 6}" y2="${floor}" stroke="#2b2118"/>`;
  o += `<text transform="translate(${x0 - 10} ${(+Y(c.H) + floor) / 2}) rotate(-90)" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2118">${fmt(c.H / 10)} cm</text>`;
  const bw = c.width / 2;
  o += `<line x1="${X(-bw)}" y1="${floor + 16}" x2="${X(bw)}" y2="${floor + 16}" stroke="#2b2118"/>`;
  o += `<text x="${cx}" y="${floor + 40}" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2118">${fmt(c.width / 10)} cm</text>`;
  return `<svg viewBox="${(x0 - 36).toFixed(0)} 0 ${(2 * (cx - x0 + 36)).toFixed(0)} ${(floor + 52).toFixed(0)}" role="img" aria-label="Latten-Tanne ${fmt(c.H / 10)} cm">${o}</svg>`;
}
function heroLatte() {
  const fl = 200, c = latteCalc(1500, '75', 'auto'), s = 165 / 1500;
  let o = `<rect width="340" height="220" fill="url(#g-dusk)"/>${snowDots(340, 200, 70, 21, '#fff', .8)}`;
  o += `<path d="M0 196 Q90 186 170 192 T340 190 V220 H0Z" fill="#f4f7fb"/><path d="M0 204 Q120 198 340 206 V220 H0Z" fill="#dfe7f1"/>`;
  o += halo(170, 120, 95, 100, .45) + floorShadow(170, fl, 45);
  o += latteArt(c, {s, cx: 170, floor: fl, lights: 'glow', star: true});
  o += latteArt(latteCalc(900, '75', 'auto'), {s, cx: 268, floor: fl + 4, lights: 'glow'});
  return heroSVG(o, 'Latten-Tanne mit Lichterkette im Schnee');
}

/* ================= JUNIOR: ADVENTS-TANNE ================= */
function adventCalc(H) {
  const cot = 1 / Math.tan(67.5 * DEG), g = 10;
  const hs = (H - 3 * g) / 4, W = 8 * hs * cot;
  const sh = Math.round(0.06 * H / 5) * 5;
  const dirs = [0, 1, -1, 1];
  const strips = [0, 1, 2, 3].map(k => ({k, top: 2 * k * hs * cot, bot: 2 * (k + 1) * hs * cot, dx: dirs[k] * sh}));
  strips.forEach(st => { st.shelf = Math.max(110, Math.round(0.6 * st.bot / 5) * 5); st.sx = st.dx + (st.k === 0 ? 0 : (st.k % 2 ? 1 : -1) * 0.18 * st.bot); });
  const batten = H - 0.5 * hs;
  return {H, cot, g, hs, W, sh, strips, batten, boardW: Math.ceil(W / 10) * 10 + 10, boardH: Math.ceil(4 * hs / 10) * 10 + 10,
    leiste: strips.reduce((s, x) => s + x.shelf, 0) + batten};
}
/* ---- Advents-Tanne ---- */
function adventArt(c, o) {
  const s = o.s, cx = o.cx, y0 = o.y0;
  const pt = (x, y) => [cx + x * s, y0 + y * s];
  let g = '', front = '';
  const words = ['eins', 'zwei', 'drei', 'vier'];
  c.strips.forEach(x => {
    const yt = x.k * (c.hs + c.g), yb = yt + c.hs;
    g += woodPoly([pt(x.dx - x.top / 2, yt), pt(x.dx + x.top / 2, yt), pt(x.dx + x.bot / 2, yb), pt(x.dx - x.bot / 2, yb)], 'ply');
    const sl = x.shelf, sx = x.sx;
    g += woodPoly([pt(sx - sl / 2, yb - 22), pt(sx + sl / 2, yb - 22), pt(sx + sl / 2, yb), pt(sx - sl / 2, yb)], 'oak');
    const cxx = sx + (x.k % 2 ? 0.2 : -0.2) * sl * (x.k ? 1 : 0);
    const cb = pt(cxx - 20, yb - 60), cw = 40 * s, ch = 38 * s;
    if (o.green) front += branch(...pt(sx - sl * 0.45, yb - 24), sl * 0.6 * s, -8 + (x.k % 2 ? 6 : -6), 30 + x.k);
    front += `<rect x="${f1(cb[0])}" y="${f1(cb[1])}" width="${f1(cw)}" height="${f1(ch)}" rx="${f1(4 * s)}" fill="url(#g-candle)" stroke="#e2d6c0" stroke-width=".6"/>`;
    const fl = pt(cxx, yb - 68);
    front += `<g filter="url(#f-glow)"><ellipse cx="${f1(fl[0])}" cy="${f1(fl[1])}" rx="${f1(5 * s)}" ry="${f1(10 * s)}" fill="#ffcf55"/></g>`;

  });
  return `<g filter="url(#f-sh)">${g}</g>${front}`;
}
function adventSVG(c, labels = true) {
  const s = 300 / (c.W + 2 * c.sh), cx = 170, y0 = 30;
  const X = x => (cx + x * s).toFixed(1), Y = y => (y0 + y * s).toFixed(1);
  let o = adventArt(c, {s, cx, y0, words: true, minFont: 12});
  const bottom = 4 * c.hs + 3 * c.g;
  o += `<rect x="${X(-25)}" y="${Y(0.5 * c.hs)}" width="${(50 * s).toFixed(1)}" height="${(c.batten * s).toFixed(1)}" fill="none" stroke="#6f6254" stroke-width="1.3" stroke-dasharray="5 4"/>`;
  o += badge(+X(0) + 20, +Y(0) + 4, 1);
  const l = c.strips[2];
  o += badge(+X(l.dx - l.bot / 2) - 16, +Y(2 * (c.hs + c.g) + c.hs * 0.5), 2);
  const sh3 = c.strips[3];
  o += badge(+X(sh3.sx - sh3.shelf / 2) - 16, +Y(bottom - 11), 3);
  o += badge(+X(25) + 16, +Y(c.hs + c.g + c.hs * 0.45), 4);
  const yb = +Y(bottom) + 18;
  o += `<line x1="${X(-c.W / 2)}" y1="${yb}" x2="${X(c.W / 2)}" y2="${yb}" stroke="#2b2118"/><text x="${cx}" y="${yb + 22}" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2118">${fmt(c.W / 10)} cm breit · ${fmt(c.H / 10)} cm hoch</text>`;
  return `<svg viewBox="0 0 340 ${(yb + 34).toFixed(0)}" role="img" aria-label="Advents-Tanne">${o}</svg>`;
}
function heroAdvent() {
  const c = adventCalc(600), s = 190 / (4 * c.hs + 3 * c.g);
  let o = `<rect width="340" height="220" fill="url(#g-wall)"/>` + halo(170, 115, 120, 100, .35);
  o += `<g transform="translate(4 6)" opacity=".18" filter="url(#f-blur)">${adventArt(c, {s, cx: 170, y0: 14})}</g>`;
  o += adventArt(c, {s, cx: 170, y0: 14, words: true, green: true, minFont: 8});
  return heroSVG(o, 'Advents-Tanne mit vier LED-Kerzen');
}

/* ================= JUNIOR: AST-RENTIER ================= */
function rentierCalc(L) {
  const r = v => Math.round(v / 5) * 5, d = v => Math.max(4, Math.round(v));
  return {L, parts: [
    {name: 'Körper', n: 1, len: r(L), dia: d(0.15 * L)},
    {name: 'Beine', n: 4, len: r(0.8 * L), dia: d(0.05 * L)},
    {name: 'Hals', n: 1, len: r(0.5 * L), dia: d(0.08 * L)},
    {name: 'Kopf', n: 1, len: r(0.33 * L), dia: d(0.12 * L)},
    {name: 'Geweih (Astgabeln)', n: 2, len: r(0.5 * L), dia: d(0.03 * L)},
    {name: 'Schwanz', n: 1, len: r(0.12 * L), dia: d(0.04 * L)}
  ], jute: Math.round(L * 12 / 100) / 10, height: 0.8 * L + 0.5 * L * 0.9 + 0.5 * L};
}
/* ---- Ast-Rentier ---- */
function rentierArt(c, o) {
  const s = o.s, x0 = o.x0, yb = o.yb, L = c.L;
  const P = (x, y) => [x0 + x * s, yb - y * s];
  const stick = (a, b, wd, col = '#6e4c2f') => { const A = P(...a), B = P(...b); return `<line x1="${f1(A[0])}" y1="${f1(A[1])}" x2="${f1(B[0])}" y2="${f1(B[1])}" stroke="${col}" stroke-width="${f1(wd * s)}" stroke-linecap="round"/><line x1="${f1(A[0])}" y1="${f1(A[1] - wd * s * 0.22)}" x2="${f1(B[0])}" y2="${f1(B[1] - wd * s * 0.22)}" stroke="#a88560" stroke-opacity=".5" stroke-width="${f1(wd * s * 0.18)}" stroke-linecap="round"/>`; };
  const legH = 0.8 * L * Math.cos(15 * DEG);
  let g = '';
  for (const [bx, sp] of [[0.15 * L, -1], [0.22 * L, 1], [0.78 * L, -1], [0.85 * L, 1]]) g += stick([bx, legH], [bx + sp * 0.8 * L * Math.sin(12 * DEG), 0], 0.05 * L);
  g += stick([0, legH + 0.02 * L], [L, legH + 0.02 * L], 0.15 * L);
  g += stick([0.02 * L, legH + 0.06 * L], [-0.1 * L, legH + 0.12 * L], 0.04 * L);
  const nx = L * 0.9, ny = legH + 0.05 * L, hx = nx + 0.5 * L * Math.cos(65 * DEG), hy = ny + 0.5 * L * Math.sin(65 * DEG);
  g += stick([nx, ny], [hx, hy], 0.08 * L);
  const kx = hx + 0.33 * L * Math.cos(-20 * DEG), ky = hy + 0.33 * L * Math.sin(-20 * DEG);
  for (const [ang, off] of [[110, 0], [70, 0.05]]) {
    const ax = hx + off * L, ay = hy + 0.04 * L, ex = ax + 0.5 * L * Math.cos(ang * DEG), ey = ay + 0.5 * L * Math.sin(ang * DEG);
    g += stick([ax, ay], [ex, ey], 0.03 * L);
    const mx = ax + 0.25 * L * Math.cos(ang * DEG), my = ay + 0.25 * L * Math.sin(ang * DEG);
    g += stick([mx, my], [mx + 0.15 * L * Math.cos((ang - 35) * DEG), my + 0.15 * L * Math.sin((ang - 35) * DEG)], 0.025 * L);
  }
  g += stick([hx - 0.03 * L, hy + 0.01 * L], [kx, ky], 0.12 * L);
  // Jute-Wicklung
  for (const bx of [0.18 * L, 0.82 * L]) for (let i = 0; i < 6; i++) {
    const A = P(bx - 0.07 * L + i * 0.028 * L, legH + 0.1 * L), B = P(bx - 0.03 * L + i * 0.028 * L, legH - 0.06 * L);
    g += `<line x1="${f1(A[0])}" y1="${f1(A[1])}" x2="${f1(B[0])}" y2="${f1(B[1])}" stroke="#d9bf8a" stroke-width="${f1(Math.max(1.2, 0.018 * L * s))}" stroke-linecap="round"/>`;
  }
  const E = P(hx + 0.02 * L, hy + 0.05 * L), N = P(kx, ky), Ey = P(hx + 0.12 * L, hy + 0.0 * L);
  g += `<ellipse cx="${f1(E[0])}" cy="${f1(E[1])}" rx="${f1(0.07 * L * s)}" ry="${f1(0.035 * L * s)}" fill="#e9dcc7" stroke="#cbb89b" stroke-width=".5" transform="rotate(-30 ${f1(E[0])} ${f1(E[1])})"/>`;
  g += `<circle cx="${f1(Ey[0])}" cy="${f1(Ey[1])}" r="${f1(0.012 * L * s + 0.6)}" fill="#1d1510"/>`;
  g += `<circle cx="${f1(N[0])}" cy="${f1(N[1])}" r="${f1(0.045 * L * s)}" fill="#d0342c"/><circle cx="${f1(N[0] - 0.012 * L * s)}" cy="${f1(N[1] - 0.015 * L * s)}" r="${f1(0.012 * L * s)}" fill="#fff" opacity=".7"/>`;
  return {g, top: P(0.5 * L, legH + 0.1 * L)};
}
function rentierSVG(c, labels = true) {
  const s = 170 / c.L, x0 = 40, yb = 326, L = c.L;
  const {g} = rentierArt(c, {s, x0, yb});
  const P = (x, y) => [x0 + x * s, yb - y * s];
  const legH = 0.8 * L * Math.cos(15 * DEG), nx = L * 0.9, ny = legH + 0.05 * L, hx = nx + 0.5 * L * Math.cos(65 * DEG), hy = ny + 0.5 * L * Math.sin(65 * DEG);
  const kx = hx + 0.33 * L * Math.cos(-20 * DEG), ky = hy + 0.33 * L * Math.sin(-20 * DEG);
  const B = (x, y, n) => { const q = P(x, y); return badge(q[0], q[1], n); };
  const lab = B(0.5 * L, legH + 0.22 * L, 1) + B(0.5 * L, legH * 0.45, 2) + B(nx + 0.05 * L, ny + 0.35 * L, 3) + B(kx + 0.12 * L, ky - 0.1 * L, 4) + B(hx - 0.35 * L, hy + 0.4 * L, 5);
  return `<svg viewBox="0 0 340 340" role="img" aria-label="Ast-Rentier"><g filter="url(#f-sh)">${g}</g>${lab}</svg>`;
}
function heroRentier() {
  const c = rentierCalc(150), s = 0.62;
  let o = `<rect width="340" height="220" fill="url(#g-cream)"/>`;
  const r = rng(5);
  for (let i = 0; i < 14; i++) o += `<circle cx="${f1(r() * 340)}" cy="${f1(r() * 220)}" r="${f1(8 + 22 * r())}" fill="#f2c46b" opacity="${(0.08 + 0.15 * r()).toFixed(2)}" filter="url(#f-blur)"/>`;
  const {g, top} = rentierArt(c, {s, x0: 110, yb: 196});
  o += `<line x1="${f1(top[0])}" y1="0" x2="${f1(top[0])}" y2="${f1(top[1])}" stroke="#cbb07a" stroke-width="1.4"/>`;
  o += `<g filter="url(#f-sh)">${g}</g>`;
  const {g: g2, top: t2} = rentierArt(rentierCalc(150), {s: 0.38, x0: 32, yb: 150});
  o += `<line x1="${f1(t2[0])}" y1="0" x2="${f1(t2[0])}" y2="${f1(t2[1])}" stroke="#cbb07a" stroke-width="1.1"/><g filter="url(#f-sh)" opacity=".92">${g2}</g>`;
  return heroSVG(o, 'Rentiere aus Ästen als Baumschmuck');
}

/* ================= PAPIER ================= */
const fitsA4 = a => Math.floor(210 / a) * Math.floor(297 / a);
const pnote = `<div class="safe"><b>Für Groß und Klein:</b> Kinder ab ca. 6 Jahren schaffen das mit etwas Hilfe beim Messen und Schneiden. Scharfes Falten mit dem Fingernagel oder einem Falzbein macht den Unterschied!</div>`;

/* ---- Masu-Schachtel ---- */
function masuCalc(B) {
  const a = B * 2 * Math.SQRT2, lid = (B + 3) * 2 * Math.SQRT2;
  return {B, a, lid, h: B / 2, perA4: fitsA4(a), lidA4: fitsA4(lid)};
}
function masuSVG(c, labels = true) {

    const box = (x, y, w, h, col, top) => `<polygon points="${x},${y} ${x + w},${y - w * 0.5} ${x + 2 * w},${y} ${x + w},${y + w * 0.5}" fill="${top}"/><polygon points="${x},${y} ${x + w},${y + w * 0.5} ${x + w},${y + w * 0.5 + h} ${x},${y + h}" fill="${col}"/><polygon points="${x + w},${y + w * 0.5} ${x + 2 * w},${y} ${x + 2 * w},${y + h} ${x + w},${y + w * 0.5 + h}" fill="${col}" opacity=".8"/>`;
    return `<svg viewBox="0 0 340 260" role="img" aria-label="Masu-Schachtel">${box(70, 150, 100, 60, '#c0504d', '#e9a19f')}${box(110, 70, 88, 34, '#e8c15a', '#f6dd94')}</svg>`;
  }
  const S = 300, o0 = 20, cx = o0 + S / 2, d = S / Math.SQRT2;
  let g = `<rect x="${o0}" y="${o0}" width="${S}" height="${S}" fill="#fdf3e3" stroke="#a8743f" stroke-width="1.5"/>`;
  g += `<line x1="${o0}" y1="${o0}" x2="${o0 + S}" y2="${o0 + S}" stroke="#cdbfa9" stroke-dasharray="5 4"/><line x1="${o0 + S}" y1="${o0}" x2="${o0}" y2="${o0 + S}" stroke="#cdbfa9" stroke-dasharray="5 4"/>`;
  g += `<g transform="rotate(45 ${cx} ${cx})"><rect x="${cx - d / 2}" y="${cx - d / 2}" width="${d}" height="${d}" fill="none" stroke="#9b4a1f" stroke-width="1.8"/>`;
  g += `<rect x="${cx - d / 4}" y="${cx - d / 4}" width="${d / 2}" height="${d / 2}" fill="#9b4a1f" fill-opacity=".15" stroke="#9b4a1f" stroke-width="1.8"/>`;
  for (const k of [-1, 1]) g += `<line x1="${cx + k * d / 4}" y1="${cx - d / 2}" x2="${cx + k * d / 4}" y2="${cx + d / 2}" stroke="#3d6b4a" stroke-width="1.4"/><line x1="${cx - d / 2}" y1="${cx + k * d / 4}" x2="${cx + d / 2}" y2="${cx + k * d / 4}" stroke="#3d6b4a" stroke-width="1.4"/>`;
  g += `</g>`;
  g += badge(cx, cx, 1) + badge(cx + d / 2 * 0.5 + 6, cx - d / 2 * 0.5 + 6, 2) + badge(o0 + 22, o0 + 22, 3);
  g += `<text x="${cx}" y="${o0 + S + 26}" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2118">Quadrat ${fmt(c.a / 10, 1)} × ${fmt(c.a / 10, 1)} cm</text>`;
  return `<svg viewBox="0 0 340 360" role="img" aria-label="Faltmuster Masu-Schachtel">${g}</svg>`;
}

/* ---- Fensterstern ---- */
function fensterCalc(D, lagen) {
  const a = D / (2 * Math.SQRT2);
  const n = 8 * (+lagen);
  return {D, a, lagen: +lagen, n, perA4: fitsA4(a), sheets: Math.ceil(n / Math.max(1, fitsA4(a)))};
}
function fensterSVG(c, labels = true) {
  const R = 150, cx = 170, cy = 170, a = R / Math.SQRT2;
  const kite = (rot, col, sc) => `<polygon points="0,0 ${a * sc},${0.4142 * a * sc} ${R * sc},0 ${a * sc},${-0.4142 * a * sc}" transform="translate(${cx} ${cy}) rotate(${rot})" fill="${col}" fill-opacity="${labels ? .55 : .7}" stroke="${labels ? '#b8862f' : '#fff3c4'}" stroke-width="1"/>`;
  const cols = ['#f6c453', '#f08a3c', '#f6c453', '#e9643f'];
  let g = '';
  if (c.lagen > 1) for (let k = 0; k < 8; k++) g += kite(22.5 + k * 45, '#f2a65a', 0.82);
  for (let k = 0; k < 8; k++) g += kite(k * 45 - 90, cols[k % 4], 1);
  let vb = '0 0 340 340';
  if (labels) {
    g += badge(cx + 0.6 * R, cy - 0.06 * R, 1) + badge(cx + 0.12 * R, cy + 0.1 * R, 2);
    g += `<text x="${cx}" y="${cy + R + 30}" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2118">Ø ${fmt(c.D / 10)} cm · ${c.n} Quadrate à ${fmt(c.a / 10, 1)} cm</text>`;
    vb = '0 0 340 360';
  }
  return `<svg viewBox="${vb}" role="img" aria-label="Fensterstern">${g}</svg>`;
}
function kiteFoldSVG() {
  const S = 120, x0 = 30, y0 = 20;
  const sq = `<rect x="${x0}" y="${y0}" width="${S}" height="${S}" fill="#fdf3e3" stroke="#a8743f"/><line x1="${x0}" y1="${y0 + S}" x2="${x0 + S}" y2="${y0}" stroke="#9b4a1f" stroke-dasharray="5 4"/>`;
  const k = 0.4142 * S;
  const kite = `<polygon points="${200},${y0 + S} ${200 + S},${y0 + S - k} ${200 + S},${y0} ${200 + k},${y0}" fill="#f6c453" fill-opacity=".6" stroke="#b8862f"/><line x1="200" y1="${y0 + S}" x2="${200 + S}" y2="${y0}" stroke="#9b4a1f" stroke-dasharray="5 4"/>`;
  return `<svg viewBox="0 0 340 170" role="img" aria-label="Quadrat zum Drachen falten">${sq}${kite}<text x="${x0 + S / 2}" y="160" text-anchor="middle" font-size="14" fill="#2b2118">1. Diagonale falten</text><text x="${200 + S / 2}" y="160" text-anchor="middle" font-size="14" fill="#2b2118">2. Kanten zur Diagonale</text></svg>`;
}

/* ---- Schneeflocke ---- */
function flockeCalc(A) { return {A, D: A * 0.95, perA4: fitsA4(A)}; }
function flockeSVG(c, labels = true) {
  const cx = 170, cy = 170, R = 140, col = labels ? '#5b8bb8' : '#dfeefa';
  const arm = `<path d="M0 0 L0 ${-R}" stroke="${col}" stroke-width="7" stroke-linecap="round"/>` +
    [0.35, 0.6, 0.82].map((f, i) => { const l = [42, 34, 20][i]; return `<path d="M0 ${-R * f} l${l * 0.866} ${-l * 0.5} M0 ${-R * f} l${-l * 0.866} ${-l * 0.5}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`; }).join('') +
    `<polygon points="0,${-R * 0.2} 8,${-R * 0.27} 0,${-R * 0.34} -8,${-R * 0.27}" fill="${labels ? '#fff' : '#2c3a4a'}"/>`;
  let g = '';
  for (let k = 0; k < 6; k++) g += `<g transform="translate(${cx} ${cy}) rotate(${k * 60})">${arm}</g>`;
  g += `<circle cx="${cx}" cy="${cy}" r="14" fill="${col}"/>`;
  let vb = '0 0 340 340';
  if (labels) { g += badge(cx + 34, cy - R * 0.92, 1) + badge(cx + 70, cy - 44, 2); vb = '0 0 340 340'; }
  return `<svg viewBox="${vb}" role="img" aria-label="Papier-Schneeflocke">${g}</svg>`;
}

}

/* ================= MALEREI ================= */
const SCRIPT = "'Dancing Script','Segoe Script','Brush Script MT','Snell Roundhand','URW Chancery L','Comic Sans MS',cursive";
const FORMATS = {105: {w: 105, h: 148, name: 'Postkarte A6'}, 145: {w: 145, h: 145, name: 'Quadratkarte'}, 148: {w: 148, h: 210, name: 'A5'}, 210: {w: 210, h: 297, name: 'A4-Bild'}};
const YEAR = new Date().getFullYear();
function malCalc(id) {
  const f = FORMATS[state[id].H] || FORMATS[105], k = 340 / f.w;
  return {f, k, W: 340, H: f.h * k, u: Math.min(340, f.h * k / 1.41)};
}
const mmOf = (c, px) => px / c.k;                    // px → mm
const cmOf = (c, px) => fmt(px / c.k / 10, 1);       // px → cm-Text
const paperBg = c => `<rect width="${c.W}" height="${f1(c.H)}" fill="#fbf8f1"/><rect width="${c.W}" height="${f1(c.H)}" filter="url(#f-noise)"/>`;
function splatter(c, n, col, seed, maxR = 2.6) {
  const r = rng(seed); let o = '';
  for (let i = 0; i < n; i++) o += `<circle cx="${f1(r() * c.W)}" cy="${f1(r() * c.H)}" r="${f1(0.5 + maxR * r() ** 3)}" fill="${col}" opacity="${(0.3 + 0.45 * r()).toFixed(2)}"/>`;
  return o;
}
function band(x1, y1, x2, y2, seed, col = '#e8cb72') {
  const r = rng(seed), top = [], bot = [], sl = -(y2 - y1) * 0.35;
  for (let i = 0; i <= 8; i++) { const t = i / 8, x = x1 + (x2 - x1) * t; top.push([x + (r() - .5) * 6, y1 + sl * t + (r() - .5) * 4]); bot.push([x + (r() - .5) * 6, y2 + sl * t + (r() - .5) * 4]); }
  return `<polygon points="${P2(top.concat(bot.reverse()))}" fill="${col}" fill-opacity=".55" filter="url(#f-wc)"/>`;
}
function aqTree(cx, yb, Ht, Wd, seed) {
  const r = rng(seed), pal = ['#2f5fa8', '#3f74c0', '#5b8ad0', '#284d8c', '#1f3f7a', '#6f93cf', '#4a6fa5'];
  let o = '';
  const n = 30;
  for (let pass = 0; pass < 2; pass++) for (let i = 0; i < n; i++) {
    const t = i / (n - 1), y = yb - Ht + t * Ht * 0.98 + (r() - .5) * Ht * 0.02;
    const base = (0.04 + 0.96 * t) * Wd / 2;
    const th = Ht / n * (0.55 + 0.5 * r()) * (pass ? 0.7 : 1);
    for (const sg of [-1, 1]) {
      const hw = base * (0.65 + 0.5 * r()) * (pass ? 0.8 : 1), droop = th * (0.6 + 1.4 * r()), x0 = cx + (r() - .5) * Wd * 0.03;
      const col = pass ? pal[4 - Math.floor(r() * 2)] : pal[Math.floor(r() * pal.length)];
      const op = (pass ? 0.25 + 0.3 * r() : 0.35 + 0.4 * r()).toFixed(2);
      const xe = x0 + sg * hw;
      o += `<path d="M${f1(x0)} ${f1(y - th)} Q${f1(x0 + sg * hw * 0.55)} ${f1(y - th * 0.8)} ${f1(xe)} ${f1(y + droop)} Q${f1(x0 + sg * hw * 0.45)} ${f1(y + th * 0.9)} ${f1(x0)} ${f1(y + th * 0.6)}Z" fill="${col}" fill-opacity="${op}"/>`;
    }
  }
  o += `<path d="M${f1(cx)} ${f1(yb - Ht * 1.05)} L${f1(cx + Wd * 0.03)} ${f1(yb - Ht + Ht * 0.12)} L${f1(cx - Wd * 0.03)} ${f1(yb - Ht + Ht * 0.12)}Z" fill="#2f5fa8" fill-opacity=".7"/>`;
  return `<g filter="url(#f-wc)">${o}</g>`;
}
function groundStrokes(c, y, seed) {
  const r = rng(seed); let o = '';
  for (let i = 0; i < 9; i++) { const x = r() * c.W * 0.9 - 10, w = 40 + r() * 120, yy = y + (r() - .3) * 14; o += `<path d="M${f1(x)} ${f1(yy)} q${f1(w / 2)} ${f1(-4 - 3 * r())} ${f1(w)} 0 q${f1(-w / 2)} ${f1(5)} ${f1(-w)} 0Z" fill="${r() > .5 ? '#6b7f99' : '#3f5f93'}" fill-opacity="${(0.25 + 0.35 * r()).toFixed(2)}"/>`; }
  return `<g filter="url(#f-wc)">${o}</g>`;
}
/* ---- Aquarell-Tannen ---- */
function aqGeo(c) {
  const {W, H} = c;
  return {t1: {cx: 0.3 * W, yb: 0.88 * H, h: 0.55 * H, w: 0.46 * W}, t2: {cx: 0.73 * W, yb: 0.86 * H, h: 0.42 * H, w: 0.34 * W}, b1: [0.06 * W, 0.12 * H, 0.82 * W, 0.12 * H + 0.075 * H], b2: [0.45 * W, 0.235 * H, 0.8 * W, 0.235 * H + 0.06 * H]};
}
function paintAq(c) {
  const g = aqGeo(c), fs = 0.115 * c.W;
  let o = paperBg(c) + splatter(c, 80, '#6f8fc4', 3);
  o += band(...g.b1, 4) + band(...g.b2, 9);
  o += groundStrokes(c, g.t1.yb, 7);
  o += aqTree(g.t1.cx, g.t1.yb, g.t1.h, g.t1.w, 11) + aqTree(g.t2.cx, g.t2.yb, g.t2.h, g.t2.w, 23);
  o += `<text x="${f1(0.1 * c.W)}" y="${f1(g.b1[3] - 0.012 * c.H)}" font-family="${SCRIPT}" font-size="${f1(fs)}" fill="#1c1c1c" transform="rotate(-3 ${f1(0.1 * c.W)} ${f1(g.b1[3])})">Weihnachten</text>`;
  o += `<text x="${f1(0.52 * c.W)}" y="${f1(g.b2[3] - 0.008 * c.H)}" font-family="${SCRIPT}" font-size="${f1(fs * 0.95)}" fill="#1c1c1c" transform="rotate(-3 ${f1(0.52 * c.W)} ${f1(g.b2[3])})">${YEAR}</text>`;
  return o;
}
function planAq(c) {
  const g = aqGeo(c);
  let o = '';
  for (const [t, n] of [[g.t1, 1], [g.t2, 2]]) {
    o += `<line x1="${f1(t.cx)}" y1="${f1(t.yb - t.h - 6)}" x2="${f1(t.cx)}" y2="${f1(t.yb + 6)}" stroke="#555" stroke-dasharray="4 3"/>`;
    o += `<polyline points="${P2([[t.cx - t.w / 2, t.yb], [t.cx, t.yb - t.h], [t.cx + t.w / 2, t.yb], [t.cx - t.w / 2, t.yb]])}" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2 3"/>`;
    o += badge(t.cx + t.w / 2 + 4, t.yb - t.h * 0.55, n);
  }
  o += `<rect x="${f1(g.b1[0])}" y="${f1(g.b1[1])}" width="${f1(g.b1[2] - g.b1[0])}" height="${f1(g.b1[3] - g.b1[1])}" fill="none" stroke="#555" stroke-dasharray="4 3"/>` + badge(g.b1[2] + 4, g.b1[1] + 8, 3);
  return o;
}
function tableAq(c) {
  const g = aqGeo(c), cmX = v => cmOf(c, v);
  return partsTable([
    ['Tanne 1 (groß)', 1, `Mitte <b>${cmX(g.t1.cx)} cm</b> von links · Spitze <b>${cmX(g.t1.yb - g.t1.h)} cm</b> von oben`, `Fußlinie ${cmX(g.t1.yb)} cm von oben · unten ${cmX(g.t1.w)} cm breit`],
    ['Tanne 2 (klein)', 1, `Mitte <b>${cmX(g.t2.cx)} cm</b> von links · Spitze <b>${cmX(g.t2.yb - g.t2.h)} cm</b> von oben`, `Fußlinie ${cmX(g.t2.yb)} cm von oben · unten ${cmX(g.t2.w)} cm breit`],
    ['Goldband + Schrift', 2, `oben <b>${cmX(g.b1[1])}–${cmX(g.b1[3])} cm</b> von oben`, `zweites Band ab ${cmX(g.b2[0])} cm von links`]
  ]);

let _uid = 0;
const uid = p => p + (++_uid);
Object.assign(FORMATS, {1480: {w: 148, h: 105, name: 'Postkarte quer'}, 2100: {w: 210, h: 148, name: 'A5 quer'}, 2970: {w: 297, h: 210, name: 'A4 quer'}});
const templ = mmD => mmD < 45 ? 'Flaschendeckel' : mmD < 60 ? 'Schnapsglas' : mmD < 95 ? 'Wasserglas/Tasse' : mmD < 170 ? 'Untertasse/Schälchen' : 'Teller';
function envelope(f) {
  const k = f.w + '×' + f.h;
  return {'105×148': 'C6 (11,4 × 16,2 cm)', '148×105': 'C6 (11,4 × 16,2 cm)', '145×145': 'quadratisch 15,5 × 15,5 cm', '148×210': 'C5 (16,2 × 22,9 cm)', '210×148': 'C5 (16,2 × 22,9 cm)'}[k] || 'Bilderrahmen oder Passepartout';
}
function linGrad(stops, x2 = 0, y2 = 1) { const id = uid('lg'); return {id, def: `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o, col, op]) => `<stop offset="${o}" stop-color="${col}"${op != null ? ` stop-opacity="${op}"` : ''}/>`).join('')}</linearGradient>`}; }
function radGrad(stops, cx = .35, cy = .3) { const id = uid('rg'); return {id, def: `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r=".75">${stops.map(([o, col]) => `<stop offset="${o}" stop-color="${col}"/>`).join('')}</radialGradient>`}; }
function skyWash(c, stops, h = c.H) { const g = linGrad(stops); return `<defs>${g.def}</defs><rect x="-12" y="-12" width="${c.W + 24}" height="${f1(h + 14)}" fill="url(#${g.id})" filter="url(#f-wc)"/>`; }
function firSil(cx, yb, h, w, col, seed = 1, op = 1) {
  const r = rng(seed), n = 6, R = [], L = [];
  for (let i = 1; i <= n; i++) {
    const t = i / n, y = yb - h + t * h * 0.9, hw = w / 2 * t * (0.85 + 0.3 * r());
    R.push([cx + hw, y]); L.push([cx - hw * (0.9 + 0.2 * r()), y + (r() - .5) * 2]);
    if (i < n) { R.push([cx + hw * 0.45, y + h * 0.015]); L.push([cx - hw * 0.45, y + h * 0.015]); }
  }
  const pts = [[cx, yb - h], ...R, [cx + w * 0.05, yb - h * 0.1], [cx + w * 0.05, yb], [cx - w * 0.05, yb], [cx - w * 0.05, yb - h * 0.1], ...L.reverse()];
  return `<polygon points="${P2(pts)}" fill="${col}" fill-opacity="${op}" filter="url(#f-wc2)"/>`;
}
function stars(c, n, maxY, seed, sparkle = 4) {
  const r = rng(seed); let o = '';
  for (let i = 0; i < n; i++) o += `<circle cx="${f1(r() * c.W)}" cy="${f1(r() * maxY)}" r="${f1(0.5 + 1.2 * r() ** 2)}" fill="#fff" opacity="${(0.5 + 0.5 * r()).toFixed(2)}"/>`;
  for (let i = 0; i < sparkle; i++) { const x = r() * c.W, y = r() * maxY * 0.8, s = 4 + 4 * r(); o += `<path d="M${f1(x)} ${f1(y - s)} L${f1(x + s * .2)} ${f1(y - s * .2)} L${f1(x + s)} ${f1(y)} L${f1(x + s * .2)} ${f1(y + s * .2)} L${f1(x)} ${f1(y + s)} L${f1(x - s * .2)} ${f1(y + s * .2)} L${f1(x - s)} ${f1(y)} L${f1(x - s * .2)} ${f1(y - s * .2)}Z" fill="#fff" filter="url(#f-glow)"/>`; }
  return o;
}
function house(x, yb, w, h, wall, lit = true, tower = false) {
  let o = `<rect x="${f1(x)}" y="${f1(yb - h)}" width="${f1(w)}" height="${f1(h)}" fill="${wall}"/>`;
  if (tower) o += `<rect x="${f1(x + w * 0.3)}" y="${f1(yb - h * 2.3)}" width="${f1(w * 0.4)}" height="${f1(h * 1.4)}" fill="${wall}"/><polygon points="${P2([[x + w * 0.25, yb - h * 2.3], [x + w * 0.5, yb - h * 3.1], [x + w * 0.75, yb - h * 2.3]])}" fill="#fff" stroke="#c8d4e6" stroke-width=".6"/><line x1="${f1(x + w * .5)}" y1="${f1(yb - h * 3.1)}" x2="${f1(x + w * .5)}" y2="${f1(yb - h * 3.35)}" stroke="#d8c06a" stroke-width="1.2"/>`;
  o += `<polygon points="${P2([[x - w * 0.12, yb - h], [x + w / 2, yb - h - w * 0.5], [x + w * 1.12, yb - h]])}" fill="#fbfdff" stroke="#c8d4e6" stroke-width=".7"/>`;
  const win = lit ? '#ffd36b' : '#53627d';
  o += `<g ${lit ? 'filter="url(#f-glow)"' : ''}><rect x="${f1(x + w * 0.18)}" y="${f1(yb - h * 0.75)}" width="${f1(w * 0.22)}" height="${f1(h * 0.28)}" fill="${win}"/><rect x="${f1(x + w * 0.6)}" y="${f1(yb - h * 0.75)}" width="${f1(w * 0.22)}" height="${f1(h * 0.28)}" fill="${win}"/>${tower ? `<rect x="${f1(x + w * 0.42)}" y="${f1(yb - h * 1.9)}" width="${f1(w * 0.16)}" height="${f1(h * 0.35)}" fill="${win}"/>` : ''}</g>`;

function kugelGeo(c) { const {W, H} = c; return [{cx: .28 * W, cy: .5 * H, r: .16 * W, col: ['#ff8a80', '#d32f2f', '#8e1b1b']}, {cx: .55 * W, cy: .36 * H, r: .13 * W, col: ['#90caf9', '#1e5fae', '#0d2f63']}, {cx: .79 * W, cy: .54 * H, r: .11 * W, col: ['#ffe9a3', '#d4a52a', '#8a6414']}]; }

  let o = paperBg(c) + splatter(c, 40, '#d4a52a', 51, 2) + `<g transform="scale(1.6)">${branch(-10, 0.045 * H, W * 0.7, 6, 61)}${branch(W * 0.12, 0.03 * H, W * 0.32, -10, 62)}${branch(W * 0.38, 0.04 * H, W * 0.3, 14, 63)}</g>`;
  kugelGeo(c).forEach((k, i) => {
    const g = radGrad([[0, k.col[0]], [.55, k.col[1]], [1, k.col[2]]]);
    o += `<line x1="${f1(k.cx)}" y1="${f1(0.07 * H)}" x2="${f1(k.cx)}" y2="${f1(k.cy - k.r - 6)}" stroke="#b08d2c" stroke-width="1"/>`;

function kranzGeo(c) { return {cx: c.W / 2, cy: 0.45 * c.H, R: Math.min(0.33 * c.W, 0.3 * c.H)}; }
function paintKranz(c) {
  const {cx, cy, R} = kranzGeo(c), r = rng(71), greens = ['#2f6b3a', '#3f8a4b', '#5aa064', '#24533a', '#7bb07a'];
  let o = paperBg(c), leaves = '';

    const a = (i / 90) * 360 + (r() - .5) * 6, rad = R + (r() - .5) * 0.12 * R, x = cx + rad * Math.cos(a * DEG), y = cy + rad * Math.sin(a * DEG);
    const len = R * (0.12 + 0.06 * r()), rot = a + 90 + (r() - .5) * 70;
    leaves += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(len)}" ry="${f1(len * 0.32)}" fill="${greens[Math.floor(r() * greens.length)]}" fill-opacity="${(0.55 + 0.4 * r()).toFixed(2)}" transform="rotate(${f1(rot)} ${f1(x)} ${f1(y)})"/>`;
  }

  const by = cy + R;
  o += `<g filter="url(#f-wc2)"><path d="M${f1(cx)} ${f1(by)} q${f1(-R * .28)} ${f1(-R * .2)} ${f1(-R * .3)} ${f1(R * .02)} q${f1(R * .05)} ${f1(R * .16)} ${f1(R * .3)} ${f1(-R * .02)}Z M${f1(cx)} ${f1(by)} q${f1(R * .28)} ${f1(-R * .2)} ${f1(R * .3)} ${f1(R * .02)} q${f1(-R * .05)} ${f1(R * .16)} ${f1(-R * .3)} ${f1(-R * .02)}Z" fill="#c62828"/><path d="M${f1(cx - R * .03)} ${f1(by)} l${f1(-R * .14)} ${f1(R * .36)} l${f1(R * .08)} ${f1(-R * .03)}Z M${f1(cx + R * .03)} ${f1(by)} l${f1(R * .14)} ${f1(R * .36)} l${f1(-R * .08)} ${f1(-R * .03)}Z" fill="#a51f1f"/><circle cx="${f1(cx)}" cy="${f1(by)}" r="${f1(R * .06)}" fill="#a51f1f"/></g>`;
  o += pText(c, cx, cy - R * .05, 'Frohe', R * 0.3, '#24533a') + pText(c, cx, cy + R * .28, 'Weihnachten', R * 0.28, '#24533a');
  return o;
}

function popup3D(c, o) {
  const s = o.s, x0 = o.x0, y0 = o.y0, W = c.W * s, h = c.h * s, dx = 0.45, dy = 0.35;

  g += `<polygon points="${P2([P(0, 0, c.h), P(c.W, 0, c.h), P(c.W, c.h, c.h), P(0, c.h, c.h)])}" fill="#fbf8f1" stroke="#d8ccb3"/>`;
  if (o.sky) g += `<polygon points="${P2([P(0, 0, c.h), P(c.W, 0, c.h), P(c.W, c.h, c.h), P(0, c.h, c.h)])}" fill="#dfe9f5" opacity=".8"/>${[0.2, .5, .8].map(f => `<circle cx="${f1(P(c.W * f, c.h * .8, c.h)[0])}" cy="${f1(P(c.W * f, c.h * .8, c.h)[1])}" r="2" fill="#fff"/>`).join('')}`;
  const order = [...c.boxes].sort((a, b) => b.d - a.d);
  order.forEach(b => {
    const z = c.h - b.d;
    g += `<polygon points="${P2([P(b.x1, b.d, z), P(b.x2, b.d, z), P(b.x2, b.d, c.h), P(b.x1, b.d, c.h)])}" fill="#ece3d1" stroke="#cdbfa3"/>`;
    g += `<polygon points="${P2([P(b.x1, 0, z), P(b.x2, 0, z), P(b.x2, b.d, z), P(b.x1, b.d, z)])}" fill="#f4ede0" stroke="#cdbfa3"/>`;
    const tw = b.T * 0.62, base = P(b.cx, 0, z - 1);
    const tri = (y1, y2, wf, col) => `<polygon points="${P2([[base[0], base[1] - y2 * s], [base[0] + wf * tw * s / 2, base[1] - y1 * s], [base[0] - wf * tw * s / 2, base[1] - y1 * s]])}" fill="${col}"/>`;
    g += `<g filter="url(#f-sh)">${tri(b.T * .05, b.T * .55, 1, '#2f6b3a')}${tri(b.T * .35, b.T * .8, .75, '#3f8a4b')}${tri(b.T * .6, b.T, .5, '#5aa064')}<rect x="${f1(base[0] - tw * s * .06)}" y="${f1(base[1] - b.T * .05 * s)}" width="${f1(tw * s * .12)}" height="${f1(b.T * .05 * s)}" fill="#6b4425"/></g>`;
    g += `<g filter="url(#f-glow)">${starShape(base[0], base[1] - b.T * s - 3, Math.max(2.5, 5 * s * 2.2), '#f6c453')}</g>`;

}

function lichtCalc(H, n) {

}
function tuetenArt(cx, yb, c, s, lit = true, seed = 1) {
  const w = c.bw * s, h = (c.H - c.fold) * s, d = c.bd * s * .5, f = c.fold * s;
  let g = `<polygon points="${P2([[cx - w / 2, yb], [cx + w / 2, yb], [cx + w / 2 + d * .6, yb - d * .4], [cx + w / 2 + d * .6, yb - h - d * .4], [cx + w / 2, yb - h], [cx - w / 2, yb - h]])}" fill="${lit ? '#d9a868' : '#c99a62'}"/>`;
  g += `<rect x="${f1(cx - w / 2)}" y="${f1(yb - h)}" width="${f1(w)}" height="${f1(h)}" fill="${lit ? 'url(#g-glowbag)' : '#d6b07e'}" stroke="#a87a4a" stroke-width=".7"/>`;
  g += `<rect x="${f1(cx - w / 2)}" y="${f1(yb - h)}" width="${f1(w)}" height="${f1(f * .6)}" fill="#c08d55" opacity=".7"/>`;
  const sy = yb - c.sy * s;
  g += `<g ${lit ? 'filter="url(#f-glow)"' : ''}>${starShape(cx, sy, c.star / 2 * s, lit ? '#fff2c2' : '#f5efe6')}${[[-.3, -.32], [.3, -.28], [.32, .25], [-.28, .3]].map(([dx, dy]) => starShape(cx + dx * w, sy + dy * w * 1.3, c.small / 2 * s, lit ? '#fff2c2' : '#f5efe6')).join('')}</g>`;
  return g;
}

}

function poinGeo(c) { return {cx: c.W / 2, cy: 0.44 * c.H, R: Math.min(0.42 * c.W, 0.32 * c.H)}; }
function leafPath(cx, cy, len, w, ang) {
  const a = ang * DEG, ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux, tx = cx + ux * len, ty = cy + uy * len, mx = cx + ux * len * .45, my = cy + uy * len * .45;

}
function paintPoin(c) {

  for (let i = 0; i < 8; i++) { const a = i * 45 + 20 + (r() - .5) * 14, len = R * (0.85 + .2 * r()); leaves += `<path d="${leafPath(cx, cy, len, len * .24, a)}" fill="${['#c62828', '#d93636', '#b71c1c'][i % 3]}" fill-opacity=".9"/><path d="M${f1(cx)} ${f1(cy)} l${f1(len * .85 * Math.cos(a * DEG))} ${f1(len * .85 * Math.sin(a * DEG))}" stroke="#8e1b1b" stroke-width="1.2" opacity=".6"/>`; }
  for (let i = 0; i < 6; i++) { const a = i * 60 + (r() - .5) * 18, len = R * (0.45 + .12 * r()); leaves += `<path d="${leafPath(cx, cy, len, len * .26, a)}" fill="${['#e53935', '#ef5350'][i % 2]}" fill-opacity=".92"/>`; }
  o += `<g filter="url(#f-wc2)">${leaves}</g>`;
  for (let i = 0; i < 9; i++) { const a = i * 40, rr = R * (i % 3 ? .08 : .03); o += `<circle cx="${f1(cx + rr * Math.cos(a * DEG))}" cy="${f1(cy + rr * Math.sin(a * DEG))}" r="${f1(R * .028)}" fill="#e8c44a" stroke="#7a8a2a" stroke-width=".6"/>`; }
  o += pText(c, c.W / 2, c.H - 0.08 * c.H, 'Frohe Weihnachten', 0.1 * c.W, '#2f6b3a');
  return o;
}

const MPAT = {stern: 'Fadenstern', kardioide: 'Kardioide (Herzkurve)', nephroide: 'Nephroide (Nierenkurve)'};
function fmatheCalc(B, N, pat) {
  N = +N; const cx = B / 2, cy = B / 2, R = 0.43 * B;
  const nails = Array.from({length: N}, (_, i) => { const a = (-90 + 360 * i / N) * DEG; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  let threads = [], order = [], m = 0;
  if (pat === 'stern') {
    m = Math.round(N * 0.36); while (gcd(N, m) !== 1) m++;
    let i = 0; for (let k = 0; k < N; k++) { order.push(i); const j = (i + m) % N; threads.push([i, j]); i = j; } order.push(0);
  } else { const k = pat === 'kardioide' ? 2 : 3; for (let i = 0; i < N; i++) { const j = (k * i) % N; if (j !== i) threads.push([i, j]); } }
  const len = threads.reduce((s, [a, b]) => s + Math.hypot(nails[a][0] - nails[b][0], nails[a][1] - nails[b][1]), 0);
  return {B, N, pat, R, nails, threads, order, m, k: pat === 'kardioide' ? 2 : 3, wool: (len * (pat === 'stern' ? 1 : 2) + 2 * Math.PI * R) * 1.3 / 1000, n: N, numbered: true, outline: []};
}

  const s = 300 / c.B, x0 = 20, y0 = 12;

  let o = boardArt(c.B, s, x0, y0, true) + stringArt(c, s, x0, y0, {col: c.pat === 'stern' ? () => '#f6c453' : hue, w: .7});
  [0, Math.round(c.N / 4), Math.round(c.N / 2), Math.round(3 * c.N / 4)].forEach(i => { const q = c.nails[i], dx = q[0] - c.B / 2, dy = q[1] - c.B / 2, L = Math.hypot(dx, dy); o += `<text x="${f1(x0 + (q[0] + dx / L * 9) * s)}" y="${f1(y0 + (q[1] + dy / L * 9) * s + 4)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${i}</text>`; });
  o += `<text x="170" y="${f1(y0 + c.B * s + 30)}" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2118">${MPAT[c.pat]} · ${c.N} Nägel</text>`;

}

    if (!ps.length) return '';
    const groups = GROUPS[id];
    const body = groups ? groups.map(([gid, gname, gtxt]) => { const g = ps.filter(p => p.group === gid); return g.length ? `<h3 class="subsec">${gname}</h3>${gtxt ? `<p class="muted small">${gtxt}</p>` : ''}<div class="cards">${g.map(card).join('')}</div>` : ''; }).join('') : `<div class="cards">${ps.map(card).join('')}</div>`;
    return `<section id="sec-${id}" class="catsec"><h2 class="sec cat-${id}">${name}</h2><p class="muted small">${txt}</p>${body}</section>`;
  }).join('');
  return h;
}
function render() {
  const r = route();
  const back = document.getElementById('back');
  if (r.abc) { back.hidden = false; renderABC(); return; }
  const {pid, tab} = r;
  if (!pid) {
    back.hidden = true;
    document.getElementById('htitle').textContent = 'Werkstatt';
    document.getElementById('hsub').textContent = 'Holz · Papier · Malerei';
    app.innerHTML = homeHTML();
    return;
  }
  const p = PROJECTS[pid], st = state[pid], c = p.calc();
  back.hidden = false;
  document.getElementById('htitle').textContent = p.title;
  const sizeTxt = p.formats ? `Format: ${(FORMATS[st.H] || FORMATS[105]).name}` : `Größe: ${fmt(st.H / 10)} cm`;
  document.getElementById('hsub').textContent = sizeTxt;
  if (tab === 'druck') { app.innerHTML = renderPrint(p, c, sizeTxt); return; }
  if (tab === 'vorlage' && p.templateInner) { app.innerHTML = renderTemplate(p, c); return; }
  const isPreset = p.presets.includes(+st.H);
  let html;
  if (p.formats) {
    html = `<div class="sizebar"><div class="lbl">Format</div><div class="chips">${p.presets.map(h => `<button class="chip ${+st.H === h ? 'on' : ''}" data-h="${h}">${FORMATS[h].name}</button>`).join('')}</div>`;
  } else {
    html = `<div class="sizebar"><div class="lbl">${p.sizeLabel || 'Größe (Gesamthöhe)'}</div><div class="chips">
    ${p.presets.map(h => `<button class="chip ${+st.H === h ? 'on' : ''}" data-h="${h}">${fmt(h / 10)} cm</button>`).join('')}
    ${p.noCustom ? '' : `<label class="custom">eigene: <input type="number" inputmode="numeric" min="${p.range[0] / 10}" max="${p.range[1] / 10}" step="1" value="${isPreset ? '' : fmt(st.H / 10)}" placeholder="cm" id="hcustom"> cm</label>`}</div>
    ${p.sizeExtra(c) ? `<div class="row2">${p.sizeExtra(c)}</div>` : ''}`;
  }
  html += `<div class="toolbar"><button class="tbtn ${state.fav[pid] ? 'on' : ''}" data-fav="1">${state.fav[pid] ? '★ Gemerkt' : '☆ Merken'}</button><button class="tbtn" data-share="1">Teilen</button><a class="tbtn" href="#/${pid}/druck">Drucken / PDF</a></div></div>`;
  html += `<nav class="tabs">${TABS.map((t, i) => `<button data-tab="${t[0]}" class="${t[0] === tab ? 'on' : ''}"><span class="n">${i + 1}</span>${tabName(p, t)}</button>`).join('')}</nav>`;
  html += `<div id="content">${renderTab(p, tab, c)}</div>`;
  app.innerHTML = html;
  const on = app.querySelector('nav.tabs .on'); if (on) on.parentNode.scrollLeft = on.offsetLeft - 40;
}
function renderPrint(p, c, sizeTxt) {
  const mat = p.material(c), steps = p.steps(c), url = shareURL(p.id);
  const ul = arr => `<ul class="plist">${arr.map(t => `<li>☐ ${t}</li>`).join('')}</ul>`;
  return `<div class="printbar"><button class="btn pri" data-print="1">Jetzt drucken / als PDF speichern</button><a href="#/${p.id}/ziel">← zurück</a></div>
  <div class="printdoc">
    <div class="ph"><div><h1>${p.title}</h1><p><b>${sizeTxt}</b></p><p class="muted">${p.teaser}</p></div><div class="qr">${qrSVG(url)}<small>Online-Anleitung<br>mit Rechner</small></div></div>
    <div class="heroimg">${p.thumb()}</div>
    ${p.ziel(c)}
    <div class="panel"><h3>Was brauche ich?</h3><h4>${p.cat === 'papier' ? 'Papier' : p.cat === 'mal' ? 'Papier & Farben' : p.id === 'rentier' ? 'Äste' : 'Holz'}</h4>${ul(mat.wood)}${mat.extra}<h4>Kleinteile</h4>${ul(mat.small)}<h4>Werkzeug</h4>${ul(mat.tools)}</div>
    ${p.zuschnitt(c)}
    ${p.winkel(c)}
    <div class="panel"><h3>Schritt für Schritt</h3><ol class="psteps">${steps.map(s => `<li><b>${s.t}</b>${s.b}</li>`).join('')}</ol></div>
    <p class="small muted">Werkstatt · ${esc(url)}</p>
  </div>`;
}
function renderTab(p, tab, c) {
  const idx = TABS.findIndex(t => t[0] === tab), nxt = TABS[idx + 1];
  const nextLink = nxt ? `<a class="next" href="#/${p.id}/${nxt[0]}">Weiter: ${tabName(p, nxt)} →</a>` : '';
  if (tab === 'ziel') return `<div class="heroimg">${p.thumb()}</div>` + p.ziel(c).replace('<div class="drawing">', `<h4 class="ch">${p.cat === 'mal' ? 'So sieht es aus' : 'Konzeptzeichnung mit Maßen'}</h4><div class="drawing">`) + nextLink;
  if (tab === 'zuschnitt') return p.zuschnitt(c) + nextLink;
  if (tab === 'winkel') return p.winkel(c) + nextLink;
  if (tab === 'material') {
    const mat = p.material(c), key = p.id + '-' + c.H;
    const buy = state.buy[key] || [];
    const list = (arr, off) => arr.map((t, i) => `<label class="check ${buy.includes(off + i) ? 'done' : ''}"><input type="checkbox" data-buy="${off + i}" ${buy.includes(off + i) ? 'checked' : ''}><span>${t}</span></label>`).join('');
    return `<div class="panel"><h3>Einkaufs- und Werkzeugliste</h3><p class="small muted">Zum Abhaken – wird auf diesem Gerät gespeichert.</p>
      <h4>${p.cat === "papier" ? "Papier" : p.cat === "mal" ? "Papier & Farben" : p.id === "rentier" ? "Äste" : "Holz"}</h4>${list(mat.wood, 0)}${mat.extra}
      <h4>Kleinteile</h4>${list(mat.small, 100)}
      <h4>Werkzeug</h4>${list(mat.tools, 200)}</div>` + nextLink;
  }
  if (tab === 'anleitung') {
    const steps = p.steps(c), done = state.done[p.id] || [];
    let i = Math.min(state.step[p.id] || 0, steps.length - 1);
    const s = steps[i], ok = done.includes(i);
    const pct = Math.round(done.length / steps.length * 100);
    return `<div class="panel step">
      <div class="small muted">${done.length} von ${steps.length} erledigt</div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="stepnav">${steps.map((_, k) => `<button data-step="${k}" class="${k === i ? 'on' : ''} ${done.includes(k) ? 'ok' : ''}" aria-label="Schritt ${k + 1}">${done.includes(k) ? '✓' : k + 1}</button>`).join('')}</div>
      <h3><span class="num">Schritt ${i + 1}</span> ${s.t}</h3>
      ${s.b}
      <div class="btns">
        <button class="btn sec" data-go="${i - 1}" ${i === 0 ? 'disabled' : ''}>← Zurück</button>
        <button class="btn ${ok ? 'sec' : 'ok'}" data-done="${i}">${ok ? 'Doch nicht erledigt' : '✓ Erledigt'}</button>
        <button class="btn pri" data-go="${i + 1}" ${i === steps.length - 1 ? 'disabled' : ''}>Weiter →</button>
      </div></div>
      ${pct === 100 ? `<div class="note"><b>Fertig!</b> Viel Freude damit. 🎄</div>` : ''}`;
  }
  return '';
}

/* ---------------- Ereignisse ---------------- */
app.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.cat) { const el = document.getElementById('sec-' + b.dataset.cat); if (el) el.scrollIntoView({behavior: 'smooth'}); return; }
  if (b.dataset.filter) { state.filter = b.dataset.filter; save(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (b.dataset.print) { window.print(); return; }
  const {pid} = route();
  if (b.dataset.fav) { state.fav[pid] = !state.fav[pid]; if (!state.fav[pid]) delete state.fav[pid]; save(); render(); toast(state.fav[pid] ? 'Auf „Meine Projekte“ gemerkt' : 'Nicht mehr gemerkt'); return; }
  if (b.dataset.share) {
    const url = shareURL(pid), p = PROJECTS[pid];
    try { if (navigator.share) { await navigator.share({title: p.title, text: `Anleitung: ${p.title}`, url}); return; } } catch (err) { return; }
    try { await navigator.clipboard.writeText(url); toast('Link kopiert – inklusive Größe'); } catch (err) { prompt('Link zum Kopieren:', url); }
    return;
  }
  if (b.dataset.h) { state[pid].H = +b.dataset.h; save(); render(); }
  else if (b.dataset.tab) { location.hash = `#/${pid}/${b.dataset.tab}`; }
  else if (b.dataset.step != null) { state.step[pid] = +b.dataset.step; save(); render(); }
  else if (b.dataset.go != null) { state.step[pid] = +b.dataset.go; save(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else if (b.dataset.done != null) {
    const i = +b.dataset.done, d = state.done[pid] = state.done[pid] || [];
    const k = d.indexOf(i);
    if (k >= 0) d.splice(k, 1); else { d.push(i); const n = PROJECTS[pid].steps(PROJECTS[pid].calc()).length; if (i < n - 1) state.step[pid] = i + 1; }
    save(); render();
  }
});
app.addEventListener('change', e => {
  const {pid} = route();
  const el = e.target;
  if (el.id === 'hcustom') {
    const p = PROJECTS[pid], v = Math.round(parseFloat(String(el.value).replace(',', '.')) * 10);
    if (v >= p.range[0] && v <= p.range[1]) { state[pid].H = v; save(); render(); }
    else { el.value = ''; alert(`Bitte eine Höhe zwischen ${p.range[0] / 10} und ${p.range[1] / 10} cm eingeben.`); }
  } else if (el.dataset.k) {
    state[pid][el.dataset.k] = el.value; save(); render();
  } else if (el.dataset.buy != null) {
    const key = pid + '-' + state[pid].H, arr = state.buy[key] = state.buy[key] || [], i = +el.dataset.buy;
    const k = arr.indexOf(i); if (el.checked && k < 0) arr.push(i); if (!el.checked && k >= 0) arr.splice(k, 1);
    el.closest('.check').classList.toggle('done', el.checked); save();
  }
});
document.getElementById('back').addEventListener('click', () => { if (route().tab === 'druck' || route().tab === 'vorlage') history.back(); else location.hash = '#/'; });
window.addEventListener('hashchange', () => { applyQuery(); render(); window.scrollTo(0, 0); });
applyQuery();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
